<title>Carnet de Dégustation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: en-tête fixe + grille de tuiles stats + formulaire pliable + liste filtrable en cartes */
:root{
  --bg:#ECE8DF;
  --surface:#FFFFFF;
  --ink:#241D16;
  --muted:#847A68;
  --line:#DBD4C5;
  --wine:#7E2234;
  --wine-ink:#FFFFFF;
  --amber:#B9802B;
  --amber-soft:#F1E3C4;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1611;
    --surface:#262019;
    --ink:#ECE5D6;
    --muted:#9C9080;
    --line:#3A3127;
    --wine:#D9697C;
    --wine-ink:#1B1611;
    --amber:#E3AC5C;
    --amber-soft:#3A2E1C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1611;
  --surface:#262019;
  --ink:#ECE5D6;
  --muted:#9C9080;
  --line:#3A3127;
  --wine:#D9697C;
  --wine-ink:#1B1611;
  --amber:#E3AC5C;
  --amber-soft:#3A2E1C;
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
h1,h2,.display{font-family:'Fraunces',Georgia,serif;}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 60px;}
header{display:flex;flex-direction:column;gap:4px;margin-bottom:22px;}
header .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;}
h1{font-size:34px;margin:0;font-weight:600;text-wrap:balance;}
header p{margin:2px 0 0;color:var(--muted);font-size:14px;}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;}
.stat .num{font-family:'Fraunces',Georgia,serif;font-size:26px;font-variant-numeric:tabular-nums;line-height:1;}
.stat .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:20px;overflow:hidden;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;gap:10px;}
.panel-head h2{font-size:17px;margin:0;font-weight:600;}
.panel-head .chevron{transition:transform .2s;color:var(--muted);flex-shrink:0;}
.panel.open .chevron{transform:rotate(180deg);}
.panel-body{padding:0 18px 18px;display:grid;gap:12px;}
.panel:not(.open) .panel-body{display:none;}

.field{display:flex;flex-direction:column;gap:5px;min-width:0;}
.field label{font-size:12px;color:var(--muted);font-weight:600;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:480px){.row2{grid-template-columns:1fr;}}
input[type=text],input[type=date],input[type=number],textarea,select{
  font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);width:100%;
}
textarea{resize:vertical;min-height:60px;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--wine);outline-offset:1px;}

.stars-input{display:flex;gap:4px;}
.stars-input button{
  background:none;border:none;font-size:24px;line-height:1;cursor:pointer;padding:2px;color:var(--line);
}
.stars-input button.on{color:var(--amber);}
.stars-input button:focus-visible{outline:2px solid var(--wine);border-radius:4px;}

.btn{
  font:inherit;font-weight:600;font-size:14px;padding:10px 18px;border-radius:8px;border:none;cursor:pointer;
}
.btn-primary{background:var(--wine);color:var(--wine-ink);}
.btn-primary:hover{opacity:.9;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
.btn-ghost:hover{color:var(--ink);}
.actions{display:flex;gap:10px;justify-content:flex-end;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.toolbar input[type=text]{flex:1;min-width:140px;}
.toolbar select{width:auto;flex:0 0 auto;}
.count{font-size:13px;color:var(--muted);margin-bottom:10px;}

.list{display:grid;gap:10px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;min-width:0;}
.card .main{flex:1;min-width:0;}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
.card .name{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600;}
.card .tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--wine);background:var(--amber-soft);padding:2px 8px;border-radius:999px;flex-shrink:0;}
.card .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
.card .note{font-size:14px;margin-top:6px;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
.card .stars{color:var(--amber);font-size:14px;letter-spacing:1px;white-space:nowrap;}
.card .ops{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
.card .ops button{background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px;padding:2px 4px;}
.card .ops button:hover{color:var(--wine);}

.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.empty .display{font-size:20px;color:var(--ink);margin-bottom:6px;}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Journal personnel</div>
    <h1>Carnet de Dégustation</h1>
    <p>Chaque boisson méritée, notée et retrouvée.</p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="panel" id="formPanel">
    <div class="panel-head" id="formToggle">
      <h2 id="formTitle">Ajouter une boisson</h2>
      <span class="chevron">▾</span>
    </div>
    <div class="panel-body">
      <form id="drinkForm">
        <div class="row2">
          <div class="field">
            <label for="f-name">Nom</label>
            <input type="text" id="f-name" placeholder="Ex. Saison houblonnée, Côtes-du-Rhône 2019…" required>
          </div>
          <div class="field">
            <label for="f-cat">Catégorie</label>
            <select id="f-cat">
              <option>Bière</option>
              <option>Vin</option>
              <option>Spiritueux</option>
              <option>Cocktail</option>
              <option>Café / Thé</option>
              <option>Sans alcool</option>
              <option>Autre</option>
            </select>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>Note</label>
            <div class="stars-input" id="f-stars" data-value="0">
              <button type="button" data-v="1">★</button>
              <button type="button" data-v="2">★</button>
              <button type="button" data-v="3">★</button>
              <button type="button" data-v="4">★</button>
              <button type="button" data-v="5">★</button>
            </div>
          </div>
          <div class="row2" style="grid-template-columns:1fr 1fr;gap:12px;">
            <div class="field">
              <label for="f-date">Date</label>
              <input type="date" id="f-date">
            </div>
            <div class="field">
              <label for="f-lieu">Lieu (facultatif)</label>
              <input type="text" id="f-lieu" placeholder="Bar, à la maison…">
            </div>
          </div>
        </div>
        <div class="field">
          <label for="f-note">Notes de dégustation</label>
          <textarea id="f-note" placeholder="Arômes, impression générale, avec qui…"></textarea>
        </div>
        <div class="actions">
          <button type="button" class="btn btn-ghost" id="cancelEdit" hidden>Annuler</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Ajouter</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Rechercher par nom, lieu, note…">
    <select id="filterCat">
      <option value="">Toutes catégories</option>
      <option>Bière</option>
      <option>Vin</option>
      <option>Spiritueux</option>
      <option>Cocktail</option>
      <option>Café / Thé</option>
      <option>Sans alcool</option>
      <option>Autre</option>
    </select>
    <select id="sortBy">
      <option value="date-desc">Plus récent</option>
      <option value="date-asc">Plus ancien</option>
      <option value="rating-desc">Mieux noté</option>
      <option value="rating-asc">Moins bien noté</option>
      <option value="name-asc">Nom (A–Z)</option>
    </select>
  </div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
</div>

<script>
(function(){
  var STORAGE_KEY = 'carnet-degustation-entries';
  var drinks = [];
  var editingId = null;

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      drinks = raw ? JSON.parse(raw) : seed();
    }catch(e){ drinks = seed(); }
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(drinks)); }catch(e){}
  }
  function seed(){
    var today = new Date().toISOString().slice(0,10);
    return [
      {id:'s1', name:'IPA houblonnée (exemple)', cat:'Bière', rating:4, date:today, lieu:'À la maison', note:'Exemple — modifie ou supprime cette entrée. Belle amertume, notes d’agrumes.'},
    ];
  }
  function uid(){ return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  var starsInput = document.getElementById('f-stars');
  starsInput.addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if(!btn) return;
    setStars(parseInt(btn.dataset.v,10));
  });
  function setStars(v){
    starsInput.dataset.value = v;
    Array.prototype.forEach.call(starsInput.children, function(b){
      b.classList.toggle('on', parseInt(b.dataset.v,10) <= v);
    });
  }

  var formPanel = document.getElementById('formPanel');
  document.getElementById('formToggle').addEventListener('click', function(){
    formPanel.classList.toggle('open');
  });

  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);

  document.getElementById('drinkForm').addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('f-name').value.trim();
    if(!name) return;
    var entry = {
      id: editingId || uid(),
      name: name,
      cat: document.getElementById('f-cat').value,
      rating: parseInt(starsInput.dataset.value,10) || 0,
      date: document.getElementById('f-date').value || new Date().toISOString().slice(0,10),
      lieu: document.getElementById('f-lieu').value.trim(),
      note: document.getElementById('f-note').value.trim()
    };
    if(editingId){
      var idx = drinks.findIndex(function(d){ return d.id === editingId; });
      if(idx > -1) drinks[idx] = entry;
    } else {
      drinks.unshift(entry);
    }
    save();
    resetForm();
    render();
  });

  document.getElementById('cancelEdit').addEventListener('click', resetForm);

  function resetForm(){
    editingId = null;
    document.getElementById('drinkForm').reset();
    document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
    setStars(0);
    document.getElementById('formTitle').textContent = 'Ajouter une boisson';
    document.getElementById('submitBtn').textContent = 'Ajouter';
    document.getElementById('cancelEdit').hidden = true;
  }

  function startEdit(id){
    var d = drinks.find(function(x){ return x.id === id; });
    if(!d) return;
    editingId = id;
    document.getElementById('f-name').value = d.name;
    document.getElementById('f-cat').value = d.cat;
    document.getElementById('f-date').value = d.date;
    document.getElementById('f-lieu').value = d.lieu || '';
    document.getElementById('f-note').value = d.note || '';
    setStars(d.rating || 0);
    document.getElementById('formTitle').textContent = 'Modifier la boisson';
    document.getElementById('submitBtn').textContent = 'Enregistrer';
    document.getElementById('cancelEdit').hidden = false;
    formPanel.classList.add('open');
    formPanel.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function removeDrink(id){
    drinks = drinks.filter(function(d){ return d.id !== id; });
    save();
    if(editingId === id) resetForm();
    render();
  }

  function starsStr(n){
    n = n || 0;
    return '★★★★★'.slice(0,n) + '☆☆☆☆☆'.slice(0,5-n);
  }

  function fmtDate(iso){
    if(!iso) return '';
    var d = new Date(iso + 'T00:00:00');
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'});
  }

  function renderStats(){
    var el = document.getElementById('stats');
    var total = drinks.length;
    var avg = total ? (drinks.reduce(function(s,d){return s + (d.rating||0);},0) / total) : 0;
    var byCat = {};
    drinks.forEach(function(d){ byCat[d.cat] = (byCat[d.cat]||0) + 1; });
    var top = Object.keys(byCat).sort(function(a,b){ return byCat[b]-byCat[a]; })[0] || '—';
    el.innerHTML =
      '<div class="stat"><div class="num">' + total + '</div><div class="label">Boissons notées</div></div>' +
      '<div class="stat"><div class="num">' + (total ? avg.toFixed(1) : '—') + '</div><div class="label">Note moyenne</div></div>' +
      '<div class="stat"><div class="num" style="font-size:18px;">' + top + '</div><div class="label">Catégorie favorite</div></div>';
  }

  function getFiltered(){
    var q = document.getElementById('search').value.trim().toLowerCase();
    var cat = document.getElementById('filterCat').value;
    var sort = document.getElementById('sortBy').value;
    var list = drinks.filter(function(d){
      if(cat && d.cat !== cat) return false;
      if(q){
        var hay = (d.name + ' ' + (d.lieu||'') + ' ' + (d.note||'')).toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    list.sort(function(a,b){
      switch(sort){
        case 'date-asc': return a.date.localeCompare(b.date);
        case 'rating-desc': return (b.rating||0) - (a.rating||0);
        case 'rating-asc': return (a.rating||0) - (b.rating||0);
        case 'name-asc': return a.name.localeCompare(b.name, 'fr');
        default: return b.date.localeCompare(a.date);
      }
    });
    return list;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function render(){
    renderStats();
    var list = getFiltered();
    document.getElementById('count').textContent =
      list.length + (list.length === 1 ? ' boisson' : ' boissons') + (drinks.length !== list.length ? ' sur ' + drinks.length : '');
    var container = document.getElementById('list');
    if(!list.length){
      container.innerHTML = '<div class="empty"><div class="display">Rien à afficher</div>Ajoute ta première boisson ci-dessus, ou change les filtres.</div>';
      return;
    }
    container.innerHTML = list.map(function(d){
      return '<div class="card" data-id="' + d.id + '">' +
        '<div class="main">' +
          '<div class="top">' +
            '<span class="name">' + escapeHtml(d.name) + '</span>' +
            '<span class="tag">' + escapeHtml(d.cat) + '</span>' +
          '</div>' +
          '<div class="meta">' +
            '<span class="stars">' + starsStr(d.rating) + '</span>' +
            '<span>' + fmtDate(d.date) + '</span>' +
            (d.lieu ? '<span>· ' + escapeHtml(d.lieu) + '</span>' : '') +
          '</div>' +
          (d.note ? '<div class="note">' + escapeHtml(d.note) + '</div>' : '') +
        '</div>' +
        '<div class="ops">' +
          '<button type="button" data-act="edit">Modifier</button>' +
          '<button type="button" data-act="del">Supprimer</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  document.getElementById('list').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-act]');
    if(!btn) return;
    var card = btn.closest('.card');
    var id = card.dataset.id;
    if(btn.dataset.act === 'edit') startEdit(id);
    else if(btn.dataset.act === 'del'){
      if(card.dataset.confirm === '1'){
        removeDrink(id);
      } else {
        card.dataset.confirm = '1';
        btn.textContent = 'Confirmer ?';
        setTimeout(function(){ card.dataset.confirm=''; btn.textContent='Supprimer'; }, 2500);
      }
    }
  });

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('filterCat').addEventListener('change', render);
  document.getElementById('sortBy').addEventListener('change', render);

  load();
  render();
})();
</script>
